<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>2D Game Generator</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <h1>2D Game Generator</h1>
    <p>Enter a command to generate a simple 2D game.</p>
    <input type="text" id="title-input" placeholder="Enter a title for your game">
    <input type="text" id="command-input" placeholder="E.g., create a platformer with a blue hero">
    <button id="generate-btn">Generate</button>
    <canvas id="game-canvas"></canvas>
    <button id="restart-btn" style="display: none;">Restart</button>
    <script src="script.js"></script>
</body>
</html>
